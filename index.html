<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 防搜尋引擎抓取的隱藏標籤 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>室內配線乙級第2站 - 術科模擬練習</title>
    <style>
        /* 基礎設定 */
        body, html { 
            margin: 0; padding: 0; 
            /* 移除原本的 height: 100%，讓網頁可以產生整頁滾動 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f8f9fa; 
        }
        
        /* 頂部標題 */
        header { 
            background-color: #2c3e50; 
            color: white; 
            padding: 15px 20px; 
            text-align: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
        }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; }

        /* 標籤列 (可橫向滾動，適合手機) */
        .tabs-container { 
            display: flex; 
            overflow-x: auto; 
            background-color: #fff; 
            border-bottom: 2px solid #dee2e6; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            /* 隱藏滾動條但保留滾動功能 */
            scrollbar-width: none; 
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        /* 標籤按鈕 */
        .tab-btn { 
            flex: 0 0 auto; 
            padding: 15px 25px; 
            border: none; 
            background: none; 
            cursor: pointer; 
            font-size: 1.05rem; 
            font-weight: bold; 
            color: #6c757d; 
            border-bottom: 4px solid transparent; 
            transition: all 0.2s; 
            white-space: nowrap; 
        }
        .tab-btn:hover { background-color: #f1f3f5; color: #0d6efd; }
        .tab-btn.active { color: #0d6efd; border-bottom-color: #0d6efd; }

        /* 內容顯示區 (Iframe) */
        .content-area { 
            /* 將高度改為 100vh (整個螢幕高) 加上最小高度，讓標題可以被滑走 */
            height: 100vh; 
            min-height: 1200px; /* 確保高度足夠容納您的控制盤 */
            width: 100%; 
            display: flex; 
            flex-direction: column; 
        }
        iframe { 
            flex: 1; 
            border: none; 
            width: 100%; 
            height: 100%; 
        }

        /* 施工中佔位畫面 */
        .empty-state { 
            display: none; 
            flex: 1; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            color: #6c757d; 
            text-align: center;
            padding: 20px;
        }
        .empty-state h2 { font-size: 2rem; margin-bottom: 10px; color: #495057;}
    </style>
</head>
<body>

    <!-- 密碼鎖遮罩 -->
    <div id="login-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #2c3e50; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;">
        <h2 style="margin-bottom: 20px; font-size: 1.8rem;">🔒 系統已鎖定</h2>
        <input type="password" id="pwd-input" placeholder="請輸入密碼" style="padding: 12px; font-size: 1.2rem; border-radius: 8px; border: none; margin-bottom: 15px; text-align: center; width: 200px; outline: none; color: #333;">
        <button onclick="checkPwd()" style="padding: 10px 25px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; border: none; background: #0d6efd; color: white; font-weight: bold;">解鎖</button>
        <p id="error-msg" style="color: #ff6b6b; margin-top: 15px; font-weight: bold; display: none;">❌ 密碼錯誤，請重試！</p>
    </div>

    <header>
        <h1>室內配線乙級第2站 控制模擬</h1>
    </header>

    <div class="tabs-container" id="tabs">
        <button class="tab-btn" onclick="switchTab(1, this)">第一題</button>
        <button class="tab-btn" onclick="switchTab(2, this)">第二題</button>
        <!-- 預設啟動第3題，加上 active 樣式 -->
        <button class="tab-btn active" onclick="switchTab(3, this)">第三題</button>
        <button class="tab-btn" onclick="switchTab(4, this)">第四題</button>
        <button class="tab-btn" onclick="switchTab(5, this)">第五題</button>
        <button class="tab-btn" onclick="switchTab(6, this)">第六題</button>
        <button class="tab-btn" onclick="switchTab(7, this)">第七題</button>
        <button class="tab-btn" onclick="switchTab(8, this)">第八題</button>
    </div>

    <div class="content-area">
        <!-- 預設載入第3題 -->
        <iframe id="main-frame" src="station2_q3_v2.html"></iframe>
        
        <!-- 空白/未完成題目的提示畫面 -->
        <div id="empty-message" class="empty-state">
            <h2>🚧 盤面建置中</h2>
            <p>這題的模擬控制盤還沒做好喔！<br>請點選上方標籤切換到已有題目的畫面。</p>
        </div>
    </div>

    <script>
        // ======= 密碼機制 =======
        function checkPwd() {
            if (document.getElementById("pwd-input").value === "1019") {
                document.getElementById("login-overlay").style.display = "none";
            } else {
                document.getElementById("error-msg").style.display = "block";
                document.getElementById("pwd-input").value = "";
            }
        }
        
        // 支援按 Enter 鍵解鎖
        document.getElementById("pwd-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") { 
                e.preventDefault(); 
                checkPwd(); 
            }
        });

        // ======= 頁籤切換機制 =======
        function switchTab(questionNum, btnElement) {
            // 移除所有按鈕的 active 狀態
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            // 為點擊的按鈕加上 active 狀態
            btnElement.classList.add('active');

            const iframe = document.getElementById('main-frame');
            const emptyMsg = document.getElementById('empty-message');

            // 建立題目與檔案名稱的對應表
            const fileMap = {
                1: '01.html',
                2: '02-03.html',
                3: 'station2_q3_v2.html'
                4: 'station2_q4.html'
            };

            // 判斷該題是否有設定對應的檔案
            if (fileMap[questionNum]) {
                iframe.style.display = 'block';
                emptyMsg.style.display = 'none';
                iframe.src = fileMap[questionNum];
            } else {
                // 沒有檔案的題目顯示施工中
                iframe.style.display = 'none';
                emptyMsg.style.display = 'flex';
                iframe.src = ''; 
            }
        }
    </script>
</body>
</html>
